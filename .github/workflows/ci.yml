name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload on push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: CGO_ENABLED=0 go build -o pulp ./cmd/pulp
      # pulp must pass its own scan (project checks only: a CI runner is not a developer laptop)
      - run: ./pulp scan --skip host --fail-on medium
      - run: ./pulp scan --skip host --sarif > pulp.sarif
        if: github.event_name == 'push'
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: github.event_name == 'push'
        with:
          sarif_file: pulp.sarif
