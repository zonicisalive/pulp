version: 2

builds:
  - id: pulp
    main: ./cmd/pulp
    binary: pulp
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "pulp_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt
